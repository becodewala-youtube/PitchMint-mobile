version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # Group routine dev/test tooling into a single PR to prevent notification fatigue
      development-dependencies:
        patterns:
          - "@types/*"
          - "jest*"
          - "@testing-library/*"
          - "typescript"
    # Review Notice:
    # Packages under 'expo', 'react-native', 'react', 'react-native-*', and 'expo-*'
    # MUST be reviewed against Expo SDK compatibility guidelines.
    # Always run `npx expo-doctor` and `npx expo install --check` before merging
    # any Expo-related dependency bump.
