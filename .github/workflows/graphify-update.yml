name: Update Graphify Code Graph

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'index.ts'
      - 'App.tsx'
      - 'tsconfig.json'
  workflow_dispatch:

concurrency:
  group: graphify-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-graph:
    name: Extract & Update Knowledge Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: pip install --upgrade graphifyy

      - name: Run Graphify AST Extraction & HTML Export
        run: |
          python -m graphify extract . --code-only
          python -m graphify cluster-only .
          python -m graphify export html

      - name: Commit and push updated graph files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json graphify-out/GRAPH_REPORT.md graphify-out/graph.html graphify-out/manifest.json
          if git diff --staged --quiet; then
            echo "No changes in knowledge graph."
          else
            git commit -m "chore(graphify): update knowledge graph on main [skip ci]"
            if ! git pull --rebase origin main; then
              echo "Error: git pull --rebase origin main failed. Aborting rebase to avoid unsafe push."
              git rebase --abort || true
              exit 1
            fi
            git push origin main
          fi
