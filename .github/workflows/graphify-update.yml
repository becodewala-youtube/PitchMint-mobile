name: Update Graphify Code Graph

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'index.ts'
      - 'App.tsx'
      - 'tsconfig.json'
  workflow_dispatch:

concurrency:
  group: graphify-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extract-graph:
    name: Extract Knowledge Graph
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.record_sha.outputs.source_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record extracted commit SHA
        id: record_sha
        run: |
          set -euo pipefail
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Graphify from hash-verified lockfile
        run: python -m pip install --require-hashes -r .github/requirements-graphify.txt

      - name: Run Graphify AST Extraction & HTML Export
        run: |
          set -euo pipefail
          python -m graphify extract . --code-only
          python -m graphify cluster-only .
          python -m graphify export html

      - name: Validate generated Graphify output files
        run: |
          set -euo pipefail
          for f in graph.json GRAPH_REPORT.md graph.html manifest.json; do
            target="graphify-out/${f}"
            if [ -L "$target" ] || [ ! -f "$target" ] || [ ! -s "$target" ]; then
              echo "Error: expected non-empty regular file missing or invalid: $target"
              exit 1
            fi
          done

      - name: Upload generated Graphify files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graphify-output
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
            graphify-out/graph.html
            graphify-out/manifest.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

  commit-graph:
    name: Commit Knowledge Graph
    needs: extract-graph
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - name: Verify main has not advanced past extracted commit
        id: check_freshness
        env:
          EXPECTED_SHA: ${{ needs.extract-graph.outputs.source_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(git rev-parse HEAD)"
          if [ "$CURRENT_MAIN_SHA" != "$EXPECTED_SHA" ]; then
            echo "Skipping stale Graphify update: main advanced from ${EXPECTED_SHA} to ${CURRENT_MAIN_SHA}. A newer push will refresh the graph."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Graphify artifact
        if: steps.check_freshness.outputs.stale != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graphify-output
          path: ${{ runner.temp }}/graphify-artifact

      - name: Validate downloaded artifact layout and stage outputs
        if: steps.check_freshness.outputs.stale != 'true'
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/graphify-artifact
        run: |
          set -euo pipefail

          if [ -L "$ARTIFACT_DIR" ] || [ ! -d "$ARTIFACT_DIR" ]; then
            echo "Error: artifact directory missing or is a symlink: $ARTIFACT_DIR"
            exit 1
          fi

          echo "Inspecting downloaded artifact layout:"
          find "$ARTIFACT_DIR" -mindepth 1 -ls

          if [ -n "$(find "$ARTIFACT_DIR" -mindepth 1 ! -type f)" ]; then
            echo "Error: unexpected non-regular entry (directory, symlink, or special file) found in Graphify artifact."
            exit 1
          fi

          ACTUAL_FILES="$(find "$ARTIFACT_DIR" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          EXPECTED_FILES="$(printf 'GRAPH_REPORT.md\ngraph.html\ngraph.json\nmanifest.json')"
          if [ "$ACTUAL_FILES" != "$EXPECTED_FILES" ]; then
            echo "Error: artifact file set mismatch."
            echo "Expected:"
            printf '%s\n' "$EXPECTED_FILES"
            echo "Actual:"
            printf '%s\n' "$ACTUAL_FILES"
            exit 1
          fi

          if [ -L "graphify-out" ]; then
            echo "Error: graphify-out in repository workspace is an unexpected symlink."
            exit 1
          fi
          mkdir -p graphify-out

          for f in GRAPH_REPORT.md graph.html graph.json manifest.json; do
            src="${ARTIFACT_DIR}/${f}"
            dst="graphify-out/${f}"
            if [ -L "$src" ] || [ ! -f "$src" ] || [ ! -s "$src" ]; then
              echo "Error: invalid or empty artifact file: $src"
              exit 1
            fi
            if [ -L "$dst" ]; then
              echo "Error: destination path is an unexpected symlink: $dst"
              exit 1
            fi
            cp -- "$src" "$dst"
          done

      - name: Commit updated graph files if changed
        id: commit_changes
        if: steps.check_freshness.outputs.stale != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- \
            graphify-out/graph.json \
            graphify-out/GRAPH_REPORT.md \
            graphify-out/graph.html \
            graphify-out/manifest.json

          if git diff --staged --quiet; then
            echo "No changes in knowledge graph."
            echo "has_commit=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(graphify): update knowledge graph on main [skip ci]"
            echo "has_commit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push updated graph commit using scoped temporary authentication
        if: steps.check_freshness.outputs.stale != 'true' && steps.commit_changes.outputs.has_commit == 'true'
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ needs.extract-graph.outputs.source_sha }}
        run: |
          set -euo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 | tr -d '\r\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="$AUTH_HEADER"

          REMOTE_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$REMOTE_MAIN_SHA" != "$EXPECTED_SHA" ]; then
            echo "Skipping stale Graphify push: origin/main advanced from ${EXPECTED_SHA} to ${REMOTE_MAIN_SHA}. A newer push will refresh the graph."
            exit 0
          fi

          git push origin HEAD:refs/heads/main
